a.secondary { background:transparent; color:var(--text); border:1px solid var(--line); }
a.tertiary { background:transparent; color:var(--muted); border:1px dashed var(--line); font-weight:500; }
.back { margin-top:26px; font-size:14px; color:var(--muted); text-decoration:none; }
.back:hover { color:var(--text); }
.lang { position:fixed; top:16px; right:20px; font-size:13px; }
